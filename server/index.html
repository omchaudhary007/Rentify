<!DOCTYPE html>

  <head>

  <body>
    <!-- Generate-otp -->
    <form action="http://localhost:8080/generateotp" method="post">

    <br><br><br>

    <!-- KYC-form -->

     <form action="http://localhost:8080/user/profile">
